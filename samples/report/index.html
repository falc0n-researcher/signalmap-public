<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SignalMap Burp Report — shop</title>
<style>
  :root{
    --ink:#FFFFFF; --panel:#FFFFFF; --panel2:#F7F8FA; --panel3:#FAFBFC;
    --line:#E7EAEF; --line2:#CFD5DD;
    --text:#141924; --muted:#6B7580; --faint:#98A1AC;
    --signal:#E85002;      /* attention: findings, crossed boundaries */
    --observed:#0E8FD6;    /* OBSERVED */
    --inferred:#7A5CFF;    /* INFERRED */
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--ink); color:var(--text);
    font-family:'Space Grotesk',system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:13px; display:flex; flex-direction:column; overflow:hidden;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  /* ------------------------------------------------------------ header */
  header{
    height:60px; flex:0 0 auto; display:flex; align-items:center; gap:24px;
    padding:0 20px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  .brand{display:flex; align-items:center; gap:11px; min-width:0; flex:0 0 auto}
  .brand .name{font-size:14px; font-weight:600; line-height:1.25; white-space:nowrap}
  .brand .sub{color:var(--muted); font-size:11px; white-space:nowrap}
  .brand .sub b{color:var(--text); font-weight:500}

  .stats{display:flex; gap:2px; margin-left:auto; flex:0 1 auto; overflow:hidden}
  .stat{padding:4px 12px; border-left:1px solid var(--line); text-align:center; white-space:nowrap}
  .stat:first-child{border-left:0}
  .stat b{display:block; font-size:15px; line-height:1.15; font-weight:600}
  .stat span{font-size:10px; color:var(--muted); letter-spacing:.04em; text-transform:uppercase}
  .stat.hot b{color:var(--signal)}

  .search{flex:0 0 auto; position:relative}
  .search input{
    background:var(--panel2); border:1px solid var(--line2); color:var(--text);
    border-radius:7px; height:32px; padding:0 11px 0 30px; font-family:inherit;
    font-size:12px; width:210px;
  }
  .search input::placeholder{color:var(--faint)}
  .search input:focus{outline:none; border-color:var(--signal); background:var(--panel)}
  .search svg{position:absolute; left:9px; top:8px; width:14px; height:14px; stroke:var(--faint); fill:none}

  /* -------------------------------------------------------------- body */
  main{flex:1 1 auto; display:grid; grid-template-columns:252px 1fr 372px; min-height:0}
  aside{overflow-y:auto; background:var(--panel2); border-right:1px solid var(--line); padding:16px 14px}
  aside.right{border-right:0; border-left:1px solid var(--line); background:var(--panel); padding:0}
  .graphwrap{position:relative; min-width:0; background:var(--panel3); overflow:hidden}
  svg#graph{width:100%; height:100%; display:block; touch-action:none; cursor:grab}
  svg#graph.panning{cursor:grabbing}

  .sec{margin-bottom:20px}
  .sec > h2{
    font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint);
    margin:0 0 8px; font-weight:600;
  }
  .sec .hint{font-size:11px; color:var(--muted); line-height:1.5; margin:-2px 0 8px}

  /* views */
  .view{
    display:block; width:100%; text-align:left; background:transparent; border:1px solid transparent;
    border-radius:7px; padding:7px 9px; margin-bottom:2px; cursor:pointer;
    font-family:inherit; font-size:12.5px; color:var(--text); line-height:1.3;
  }
  .view:hover{background:var(--panel)}
  .view.active{background:var(--panel); border-color:var(--line2); font-weight:600}
  .view.active.hot{border-color:var(--signal); color:var(--signal)}
  .view .d{display:block; color:var(--muted); font-size:10.5px; font-weight:400; margin-top:1px}

  /* structure rows */
  .row{
    display:flex; align-items:center; gap:8px; width:100%; background:transparent;
    border:0; border-radius:6px; padding:5px 7px; cursor:pointer; font-family:inherit;
    font-size:12.5px; color:var(--text); text-align:left;
  }
  .row:hover{background:var(--panel)}
  .row.on{background:var(--panel); font-weight:600}
  .row .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .row .nm{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .row .ct{color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums}
  .row .chev{width:9px; color:var(--faint); font-size:9px; flex:0 0 auto; transition:transform .14s}
  .row.on .chev{transform:rotate(90deg); color:var(--signal)}

  .minirow{display:flex; gap:6px; margin-top:6px}
  .mini{
    flex:1; background:var(--panel); border:1px solid var(--line2); color:var(--muted);
    border-radius:6px; padding:5px 0; font-family:inherit; font-size:11px; cursor:pointer;
  }
  .mini:hover{border-color:var(--signal); color:var(--signal)}

  .key{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted); padding:3px 0}
  .key svg{width:28px; height:8px; flex:0 0 auto}
  .note{font-size:10.5px; color:var(--faint); line-height:1.55}
  code{font-family:ui-monospace,monospace; font-size:10.5px; background:var(--panel); padding:1px 4px; border-radius:3px}

  /* ------------------------------------------------------------ drawer */
  .dhead{padding:16px 18px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:2}
  .dhead .t{font-size:15px; font-weight:600; word-break:break-word; line-height:1.3; display:flex; align-items:center; gap:9px}
  .dhead .t .dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
  .dhead .k{font-size:10.5px; color:var(--muted); letter-spacing:.05em; text-transform:uppercase; margin-top:5px}
  .dbody{padding:14px 18px 28px}
  .back{background:none;border:0;color:var(--signal);font-family:inherit;font-size:11.5px;cursor:pointer;padding:0;margin-bottom:10px}

  .empty{color:var(--muted); font-size:12px; line-height:1.6}
  .kv{display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-top:1px solid var(--line); font-size:11.5px}
  .kv .k{color:var(--muted); flex:0 0 auto}
  .kv .v{text-align:right; word-break:break-all; font-family:ui-monospace,monospace; font-size:11px}
  .kv.link{cursor:pointer} .kv.link:hover .v{color:var(--signal)}
  .tag{display:inline-block; font-size:10.5px; padding:2px 8px; border-radius:999px; border:1px solid var(--line2); color:var(--muted); margin:3px 4px 0 0}
  .tag.warn{border-color:var(--inferred); color:var(--inferred)}
  .tag.hot{border-color:var(--signal); color:var(--signal)}
  .tag.obs{border-color:var(--observed); color:var(--observed)}
  .subh{font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--faint); margin:18px 0 6px; font-weight:600}
  .subh.hot{color:var(--signal)}
  pre{background:var(--panel2); border:1px solid var(--line); border-radius:7px; padding:11px;
    font-family:ui-monospace,monospace; font-size:11px; line-height:1.55; overflow-x:auto; margin:0 0 8px;
    white-space:pre-wrap; word-break:break-word; max-height:320px; overflow-y:auto}
  pre .red{color:var(--signal); font-weight:600}
  .ev{font-family:ui-monospace,monospace; font-size:10.5px; color:var(--observed)}

  .card{border-top:1px solid var(--line); padding:11px 0}
  .card .ti{font-weight:600; font-size:12.5px; line-height:1.35}
  .card .meta{font-size:10.5px; color:var(--muted); margin:3px 0 5px}
  .card .meta .att{color:var(--signal); letter-spacing:.1em}
  .card .bd{font-size:11.5px; color:var(--muted); line-height:1.55}
  .card .bd b{color:var(--text); font-weight:600}

  /* ------------------------------------------------------------ footer */
  footer{flex:0 0 auto; height:38px; display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; border-top:1px solid var(--line); background:var(--panel); color:var(--faint); font-size:10.5px}
  .btnrow{display:flex; gap:7px}
  .btn{background:var(--panel2); border:1px solid var(--line2); color:var(--text); border-radius:6px;
    padding:5px 11px; font-family:inherit; font-size:11.5px; cursor:pointer}
  .btn:hover{border-color:var(--signal); color:var(--signal)}

  /* ------------------------------------------------------------- graph */
  .link{stroke:var(--line2); stroke-width:1.5; fill:none}          /* tree */
  .rel{stroke:#C8D0D9; stroke-width:1.1; fill:none; opacity:.5}     /* model edge */
  .rel.inferred{stroke-dasharray:4 4; stroke:#C3B8F0}
  .rel.hot{stroke:var(--signal); stroke-width:2.4; opacity:1}
  .node{cursor:pointer}
  .node circle.core{stroke:#FFFFFF; stroke-width:2}
  .node text{font-size:10.5px; fill:var(--text); pointer-events:none; paint-order:stroke;
    stroke:var(--panel3); stroke-width:3.5px; stroke-linejoin:round; font-family:'Space Grotesk',sans-serif}
  .node text.ct{fill:var(--muted); font-size:9.5px}
  .node.dim{opacity:.2}
  .node.sel circle.core{stroke:var(--text); stroke-width:2.5}
  .node.hot circle.core{stroke:var(--signal); stroke-width:2.5}
  .hub text{font-weight:600; font-size:11.5px}
  .root text{font-weight:600; font-size:13px}
  .tip{position:absolute; pointer-events:none; background:var(--text); border-radius:5px; padding:5px 9px;
    font-size:11px; color:#fff; transform:translate(-50%,-160%); opacity:0; transition:opacity .1s;
    max-width:min(460px,55vw); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    font-family:ui-monospace,monospace}
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 120 120" width="28" height="28" fill="none" aria-hidden="true">
      <path d="M74.7 49.7A18 18 0 1 0 74.7 70.3" stroke="#141924" stroke-opacity=".85" stroke-width="6" stroke-linecap="round"/>
      <path d="M87.9 40.5A34 34 0 1 0 87.9 79.5" stroke="#141924" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"/>
      <path d="M101 31.3A50 50 0 1 0 101 88.7" stroke="#141924" stroke-opacity=".28" stroke-width="6" stroke-linecap="round"/>
      <line x1="60" y1="60" x2="102" y2="60" stroke="#E85002" stroke-width="6" stroke-linecap="round"/>
      <circle cx="106" cy="60" r="8" fill="#E85002"/>
    </svg>
    <div style="min-width:0">
      <div class="name" id="ttl">SignalMap</div>
      <div class="sub mono" id="sub"></div>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="search">
    <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="search" type="search" placeholder="Search path, host, key…" aria-label="Search the model">
  </div>
</header>

<main>
  <aside class="left">
    <div class="sec">
      <h2>Views</h2>
      <div id="views"></div>
    </div>

    <div class="sec">
      <h2>Structure</h2>
      <div class="hint">The web app, then what it is made of. Click a branch to open it.</div>
      <div id="tree"></div>
      <div class="minirow">
        <button class="mini" id="expandall">Expand all</button>
        <button class="mini" id="collapseall">Collapse all</button>
      </div>
    </div>

    <div class="sec">
      <h2>Reading the map</h2>
      <div id="edgekey"></div>
    </div>

    <div class="sec" id="trimnote"></div>
  </aside>

  <div class="graphwrap">
    <svg id="graph" role="img" aria-label="Web-app model"></svg>
    <div class="tip" id="tip"></div>
  </div>

  <aside class="right"><div id="drawer"></div></aside>
</main>

<footer>
  <div id="foot">Every node resolves to stored, redacted evidence.</div>
  <div class="btnrow">
    <button class="btn" id="reset">Reset</button>
    <button class="btn" id="export">Export PNG</button>
  </div>
</footer>

<script>

     trimmed    what was folded for legibility, and what it was

   The page draws a *hierarchy*: the web app at the root, one branch per
   group, the nodes of that group as its leaves. Model edges are drawn on
   top, between leaves that are both open. A flat force layout of the same
   data was a hairball - everything hangs off the host, so everything
   collapsed onto it.
   ========================================================================== */
const REPORT_DATA = {"webapp":"shop","ingest":"ing_0001","host":"shop.example.com","generated_at":"2026-09-24T11:22:48+00:00","roles":[{"id":"admin","label":"admin","level":"high","requests":10,"reached":7,"offered":6},{"id":"user","label":"user","level":"low","requests":20,"reached":13,"offered":8}],"cross_role":{"low":"user","high":"admin","surface":["endpoint:shop.example.com/api/admin/users","endpoint:shop.example.com/api/config/internal"],"unavailable":""},"groups":[{"id":"app","label":"Application","count":2},{"id":"route","label":"Routes & pages","count":18},{"id":"script","label":"JavaScript","count":17},{"id":"asset","label":"Other assets","count":2},{"id":"api","label":"APIs","count":21},{"id":"param","label":"Parameters","count":19},{"id":"vendor","label":"Libraries & tech","count":4},{"id":"thirdparty","label":"Third parties","count":4},{"id":"identity","label":"Identity & roles","count":3},{"id":"finding","label":"Keys & model APIs","count":10}],"signals":[{"kind":"cross_role_surface","title":"2 endpoint(s) reached by 'user' that only 'admin' is offered","summary":"GET shop.example.com/api/admin/users → 200; GET shop.example.com/api/config/internal → 200","attention":5,"confidence":"high","why":"two captured identities disagree about this endpoint: the lower-privileged one requested it, and nothing that identity's interface was served ever names it. That is where a broken access control would look exactly like this","suggested":"replay each request as the lower role and as the higher one and compare: equal bodies mean the boundary is not enforced, a denial or an empty result means it is. SignalMap has not tested this and makes no claim","entities":["shop.example.com/api/admin/users","shop.example.com/api/config/internal"],"unknowns":["ROLE_BOUNDARY_UNKNOWN"]},{"kind":"ai_surface","title":"1 model API the application refers to","summary":"api.openai.com/v1/chat/completions — OpenAI","attention":5,"confidence":"high","why":"the client-side code names a model API, and a credential for one of those providers appears in the same shipped code. Together those say the key reaches the browser","suggested":"check whether the request is made from the browser or proxied. Providers named: OpenAI","entities":["api.openai.com/v1/chat/completions"],"unknowns":["AUTHORIZATION_UNKNOWN"]},{"kind":"parameter_surface","title":"4 parameters that read as object references (IDOR candidates)","summary":"account_id on shop.example.com/api/account/address, id on shop.example.com/api/admin/users/{id}, account_id (integer) on shop.example.com/api/export, id (integer) on shop.example.com/api/orders/{id}","attention":5,"confidence":"medium","why":"an id a client supplies is where a missing per-object authorization check shows up - a reading of the parameter's name and value shape, never a claim","suggested":"confirm the check that should bound this input, with an authorized test","entities":["shop.example.com/api/account/address?account_id=","shop.example.com/api/admin/users/{id}?id=","shop.example.com/api/export?account_id=","shop.example.com/api/orders/{id}?id="],"unknowns":[]},{"kind":"protected_surface","title":"2 endpoints refused an anonymous request (401/403)","summary":"401 shop.example.com/api/billing/invoices, 403 shop.example.com/api/internal/debug","attention":5,"confidence":"high","why":"the endpoint itself refused the scan for lack of credentials - the clearest evidence of an authorization boundary, and the surface an authenticated session would open","suggested":"re-scan with a session for one of these to see what it guards","entities":["shop.example.com/api/billing/invoices","shop.example.com/api/internal/debug"],"unknowns":["AUTHENTICATED_STATE_NOT_OBSERVED"]},{"kind":"authenticated_surface","title":"35 entities mapped while holding your session","summary":"15 route(s), 18 endpoint(s)","attention":4,"confidence":"high","why":"this scan ran signed in, so the model describes the application a signed-in user sees - which part of it needs the session is the one thing a single run cannot say","suggested":"scan again without --auth-storage-state and diff the two: what only appears in this one is the authenticated surface","entities":["shop.example.com/","shop.example.com/admin","shop.example.com/api/admin/users","shop.example.com/login","shop.example.com/static/admin.chunk.js","shop.example.com/static/app.js","shop.example.com/api/config/internal","shop.example.com/static/app.js.map"],"unknowns":["UNAUTHENTICATED_STATE_NOT_OBSERVED","AUTHORIZATION_UNKNOWN"]},{"kind":"secret_candidate","title":"1 model-provider key in shipped code","summary":"https://shop.example.com/static/app.js#f113eebd68b4 — OpenAI","attention":4,"confidence":"medium","why":"a OpenAI credential format appears in code the browser downloads. Unlike most credentials this one is metered and needs no access to the application to spend: whoever holds it can bill the owner directly","suggested":"confirm whether each is a real key or a placeholder, and whether the model call belongs on the server. SignalMap has not validated any of them against any service","entities":["https://shop.example.com/static/app.js#f113eebd68b4"],"unknowns":[]},{"kind":"static_only_api","title":"2 endpoints referenced in source but never observed in use","summary":"shop.example.com/api/admin/audit, shop.example.com/api/invoices/pending","attention":4,"confidence":"high","why":"the application's own code names these, and nothing was seen calling them during this scan - the disagreement is the interesting part","suggested":"confirm whether these are reachable, and by whom","entities":["shop.example.com/api/admin/audit","shop.example.com/api/invoices/pending"],"unknowns":["AUTHORIZATION_UNKNOWN","RUNTIME_UNKNOWN"]},{"kind":"parameter_surface","title":"1 parameter that read as credentials carried in a URL","summary":"password on shop.example.com/api/session","attention":3,"confidence":"medium","why":"a token or key in a query string ends up in logs, history an const D = REPORT_DATA;

/* One colour per branch. The only place a colour is decided. */
const GROUP = {
  app:        {color:"#2B3440", icon:"◉"},
  route:      {color:"#0FA79A", icon:"▤"},
  script:     {color:"#7A5CFF", icon:"{}"},
  asset:      {color:"#9AA4B0", icon:"▪"},
  api:        {color:"#0E8FD6", icon:"⇄"},
  param:      {color:"#7FC4E8", icon:"·"},
  vendor:     {color:"#1F9D55", icon:"▣"},
  thirdparty: {color:"#C98A2E", icon:"◆"},
  identity:   {color:"#D6338A", icon:"◍"},
  finding:    {color:"#E85002", icon:"!"}
};
const colorOf = g => (GROUP[g]||GROUP.asset).color;
const LOW  = (D.cross_role && D.cross_role.low)  || "";
const HIGH = (D.cross_role && D.cross_role.high) || "";
const SURFACE = new Set((D.cross_role && D.cross_role.surface) || []);

const N = new Map(D.nodes.map(n=>[n.id,n]));
const adj = new Map(D.nodes.map(n=>[n.id,new Set()]));
D.nodes.forEach(n=>n.deg=0);
D.edges.forEach(e=>{
  if(N.has(e.from)&&N.has(e.to)){
    adj.get(e.from).add(e.to); adj.get(e.to).add(e.from);
    N.get(e.from).deg++; N.get(e.to).deg++;
  }
});

/* --------------------------------------------------------------- the tree */
const ROOT = "__root__";
const BRANCHES = (D.groups||[]).map(g=>({
  id:"__b_"+g.id, group:g.id, label:g.label, count:g.count,
  children: D.nodes.filter(n=>n.group===g.id).sort((a,b)=>(b.deg-a.deg)||a.label.localeCompare(b.label))
}));
const branchOf = new Map();
BRANCHES.forEach(b=>b.children.forEach(c=>branchOf.set(c.id,b.id)));

const open = new Set();            /* branch ids currently expanded */
let sel=null, hover=null, view="overview", search="";
const P = new Map();               /* id -> {x,y,pin} */

function visible(){
  const out=[{id:ROOT, kind:"root", label:D.webapp||D.host, full:D.host}];
  BRANCHES.forEach(b=>{
    out.push({id:b.id, kind:"branch", label:b.label, count:b.count, group:b.group, full:b.label});
    if(open.has(b.id)) b.children.forEach(c=>out.push({id:c.id, kind:"leaf", node:c, label:c.label, group:c.group, full:c.full||c.label}));
  });
  return out;
}

/* ------------------------------------------------------------- the layout
   Radial and computed, not simulated. The hierarchy already says where
   everything belongs, so there is nothing for a force to discover - and a
   layout with no simulation cannot drift, cannot thrash, and cannot get
   stuck, which the previous one did. Positions are a pure function of what
   is open, so the same model always draws the same picture. */
const svg=document.getElementById("graph"), SVGNS="http://www.w3.org/2000/svg";
let W=900,H=650, cx=450, cy=325;
function size(){ const r=svg.getBoundingClientRect(); W=r.width||900; H=r.height||650; cx=W/2; cy=H/2; }

function layout(){
  size();
  const shown=visible();
  const R1=Math.min(W,H)*0.26;
  P.set(ROOT,{x:cx,y:cy});
  const n=BRANCHES.length||1;
  BRANCHES.forEach((b,i)=>{
    const a=(i/n)*Math.PI*2 - Math.PI/2;
    b._a=a;
    const keep=P.get(b.id);
    P.set(b.id, keep&&keep.pin ? keep : {x:cx+Math.cos(a)*R1, y:cy+Math.sin(a)*R1});
    if(!open.has(b.id)) return;

    /* Children fan out inside their branch's own sector, in rings. The
       sector is narrower than the slice so two open branches never
       interleave their leaves. */
    const kids=b.children, m=kids.length;
    const sector=(Math.PI*2/n)*0.82;
    const perRing=Math.max(4, Math.round(sector/0.14));
    const rings=Math.ceil(m/perRing);
    kids.forEach((c,j)=>{
      const ring=Math.floor(j/perRing), inRing=j%perRing;
      const countHere=Math.min(perRing, m-ring*perRing);
      const t=countHere===1?0.5:(inRing/(countHere-1));
      const ang=a - sector/2 + sector*t;
      const rad=R1 + 96 + ring*54;
      const keepC=P.get(c.id);
      P.set(c.id, keepC&&keepC.pin ? keepC : {x:cx+Math.cos(ang)*rad, y:cy+Math.sin(ang)*rad});
    });
  });
  return shown;
}

/* --------------------------------------------------------------- drawing */
const gLink=document.createElementNS(SVGNS,"g");
const gRel=document.createElementNS(SVGNS,"g");
const gNode=document.createElementNS(SVGNS,"g");
const root=document.createElementNS(SVGNS,"g");
svg.appendChild(root); root.appendChild(gLink); root.appendChild(gRel); root.appendChild(gNode);

let zoom=1, panX=0, panY=0;
function applyTransform(){ root.setAttribute("transform",`translate(${panX},${panY}) scale(${zoom})`); }

function radius(v){
  if(v.kind==="root") return 17;
  if(v.kind==="branch") return 11 + Math.min(7, Math.sqrt(v.count||1)*1.6);
  return 5 + Math.min(5, Math.sqrt(v.node.deg||0)*1.6);
}
function fill(v){
  if(v.kind==="root") return "#141924";
  if(v.kind==="branch") return colorOf(v.group);
  if(v.node.state==="REACHED_BY_LOWER_ROLE") return "var(--signal)";
  return colorOf(v.group);
}

function render(){
  const shown=layout();
  const ids=new Set(shown.map(v=>v.id));
  const q=search.trim().toLowerCase();
  const nb = sel ? new Set([sel, ...(adj.get(sel)||[]), branchOf.get(sel)||"", ROOT]) : null;

  /* tree links */
  gLink.textContent="";
  const line=(a,b,cls)=>{
    const pa=P.get(a), pb=P.get(b); if(!pa||!pb) return;
    const p=document.createElementNS(SVGNS,"path");
    const mx=(pa.x+pb.x)/2, my=(pa.y+pb.y)/2;
    p.setAttribute("d",`M${pa.x},${pa.y} Q${mx},${my} ${pb.x},${pb.y}`);
    p.setAttribute("class",cls); gLink.appendChild(p);
  };
  BRANCHES.forEach(b=>{
    line(ROOT,b.id,"link");
    if(open.has(b.id)) b.children.forEach(c=>line(b.id,c.id,"link"));
  });

  /* model edges, only between leaves that are both on screen */
  gRel.textContent="";
  D.edges.forEach(e=>{
    if(!ids.has(e.from)||!ids.has(e.to)) return;
    const pa=P.get(e.from), pb=P.get(e.to); if(!pa||!pb) return;
    const p=document.createElementNS(SVGNS,"path");
    p.setAttribute("d",`M${pa.x},${pa.y} L${pb.x},${pb.y}`);
    let cls="rel"+(e.state==="INFERRED"?" inferred":"");
    if(e.type==="REACHED" && SURFACE.has(e.to) && e.from==="role:"+LOW) cls="rel hot";
    if(nb && !(nb.has(e.from)&&nb.has(e.to))) cls+=" dim";
    p.setAttribute("class",cls); gRel.appendChild(p);
  });

  /* nodes */
  gNode.textContent="";
  shown.forEach(v=>{
    const p=P.get(v.id); if(!p) return;
    const g=document.createElementNS(SVGNS,"g");
    g.setAttribute("class","node"+(v.kind==="branch"?" hub":"")+(v.kind==="root"?" root":"")
      + (v.id===sel?" sel":"")
      + ((v.kind==="leaf"&&SURFACE.has(v.id))?" hot":"")
      + (dimmed(v,q,nb)?" dim":""));
    g.setAttribute("transform",`translate(${p.x},${p.y})`);
    g.dataset.id=v.id;

    const r=radius(v);
    const c=document.createElementNS(SVGNS,"circle");
    c.setAttribute("class","core"); c.setAttribute("r",r); c.setAttribute("fill",fill(v));
    g.appendChild(c);

    if(v.kind==="branch"){
      const t=document.createElementNS(SVGNS,"text");
      t.setAttribute("text-anchor","middle"); t.setAttribute("y",r+13);
      t.textContent=v.label; g.appendChild(t);
      const ct=document.createElementNS(SVGNS,"text");
      ct.setAttribute("class","ct"); ct.setAttribute("text-anchor","middle"); ct.setAttribute("y",r+25);
      ct.textContent=v.count+(open.has(v.id)?" · open":" · click to open"); g.appendChild(ct);
    } else {
      const t=document.createElementNS(SVGNS,"text");
      t.setAttribute("text-anchor","middle"); t.setAttribute("y",r+12);
      t.textContent=v.label; g.appendChild(t);
    }
    gNode.appendChild(g);
    wire(g,v);
  });
  applyTransform();
}

function dimmed(v,q,nb){
  if(v.kind==="root") return false;
  if(q){
    const hay=((v.full||"")+" "+(v.label||"")).toLowerCase();
    if(v.kind==="branch"){
      const any=BRANCHES.find(b=>b.id===v.id).children.some(c=>((c.full||"")+" "+c.label).toLowerCase().includes(q));
      return !(hay.includes(q)||any);
    }
    return !hay.includes(q);
  }
  if(nb && v.kind==="leaf" && !nb.has(v.id)) return true;
  if(nb && v.kind==="branch" && v.id!==(branchOf.get(sel)||"")) return true;
  return false;
}

function wire(g,v){
  g.addEventListener("click",ev=>{
    ev.stopPropagation();
    if(v.kind==="branch"){ toggle(v.id); return; }
    if(v.kind==="root"){ sel=null; showOverview(); render(); return; }
    sel = sel===v.id ? null : v.id;
    sel ? showNode(sel) : showView();
    render();
  });
  g.addEventListener("pointerenter",()=>{
    hover=v.id; const p=P.get(v.id);
    tip.textContent=v.full||v.label;
    const pt=toScreen(p); tip.style.left=pt.x+"px"; tip.style.top=pt.y+"px"; tip.style.opacity=1;
  });
  g.addEventListener("pointerleave",()=>{ hover=null; tip.style.opacity=0; });

  /* Drag to reposition. The pin is set on the way down and released on the
     way up - a drag that pinned permanently is what froze the old map. */
  let dragging=false, moved=false;
  g.addEventListener("pointerdown",ev=>{
    ev.stopPropagation(); dragging=true; moved=false;
    g.setPointerCapture(ev.pointerId);
    const p=P.get(v.id)||{}; P.set(v.id,{x:p.x,y:p.y,pin:true});
  });
  g.addEventListener("pointermove",ev=>{
    if(!dragging) return; moved=true;
    const m=toGraph(ev.clientX,ev.clientY);
    P.set(v.id,{x:m.x,y:m.y,pin:true});
    tip.style.opacity=0; render();
  });
  const up=ev=>{
    if(!dragging) return; dragging=false;
    const p=P.get(v.id); if(p) P.set(v.id,{x:p.x,y:p.y,pin:moved});
    try{ g.releasePointerCapture(ev.pointerId); }catch(_){}
  };
  g.addEventListener("pointerup",up);
  g.addEventListener("pointercancel",up);
}

function toScreen(p){ const r=svg.getBoundingClientRect(); return {x:p.x*zoom+panX, y:p.y*zoom+panY}; }
function toGraph(clientX,clientY){ const r=svg.getBoundingClientRect(); return {x:(clientX-r.left-panX)/zoom, y:(clientY-r.top-panY)/zoom}; }

function toggle(id){
  open.has(id) ? open.delete(id) : open.add(id);
  syncTree(); render();
  const b=BRANCHES.find(x=>x.id===id);
  if(b && open.has(id)) showBranch(b); else showView();
}

/* ------------------------------------------------------------ pan & zoom */
const tip=document.getElementById("tip");
let panning=false, px=0, py=0;
svg.addEventListener("pointerdown",ev=>{ panning=true; px=ev.clientX; py=ev.clientY; svg.classList.add("panning"); });
svg.addEventListener("pointermove",ev=>{ if(!panning) return; panX+=ev.clientX-px; panY+=ev.clientY-py; px=ev.clientX; py=ev.clientY; applyTransform(); });
addEventListener("pointerup",()=>{ panning=false; svg.classList.remove("panning"); });
svg.addEventListener("click",()=>{ if(sel){ sel=null; showView(); render(); } });
svg.addEventListener("wheel",ev=>{
  ev.preventDefault();
  const f=ev.deltaY<0?1.12:1/1.12, before=toGraph(ev.clientX,ev.clientY);
  zoom=Math.max(0.35,Math.min(3,zoom*f));
  const r=svg.getBoundingClientRect();
  panX=ev.clientX-r.left-before.x*zoom; panY=ev.clientY-r.top-before.y*zoom;
  applyTransform();
},{passive:false});

/* ------------------------------------------------------------- the views
   A view is a saved question, not a filter: it opens the branches that
   answer it and puts the answer in the panel. */
const VIEWS=[
  {id:"overview", name:"Overview", d:"The web app and what it is made of", open:[]},
  {id:"surface",  name:"Attack surface", d:"APIs, their parameters and the routes", open:["api","param","route"]},
  {id:"code",     name:"Client code", d:"JavaScript and everything else shipped", open:["script","asset"]},
  {id:"supply",   name:"Supply chain", d:"Third parties, libraries and tech", open:["thirdparty","vendor"]},
  {id:"findings", name:"Findings", d:"Keys, model APIs and what to look at", open:["finding","identity"], hot:true},
  {id:"crossrole",name:"Cross-role surface", d:"What a lower role reached", open:["api","identity","finding"], hot:true, needs:"surface"}
];
function applyView(id){
  const v=VIEWS.find(x=>x.id===id)||VIEWS[0];
  view=id; sel=null; open.clear();
  v.open.forEach(g=>{ const b=BRANCHES.find(b=>b.group===g); if(b) open.add(b.id); });
  syncViews(); syncTree(); render(); showView();
}
function showView(){
  if(sel) return showNode(sel);
  if(view==="crossrole") return showCrossRole();
  if(view==="findings")  return showFindings();
  if(view==="overview")  return showOverview();
  const b=BRANCHES.find(b=>open.has(b.id));
  b ? showBranch(b) : showOverview();
}

/* ------------------------------------------------------------ the drawer */
const drawer=document.getElementById("drawer");
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function panel(dotColor,title,kind,body){
  drawer.innerHTML=`<div class="dhead"><div class="t"><span class="dot" style="background:${dotColor}"></span>${title}</div>
      <div class="k">${kind}</div></div><div class="dbody">${body}</div>`;
  drawer.querySelectorAll("[data-goto]").forEach(el=>el.addEventListener("click",()=>{
    const id=el.dataset.goto, b=branchOf.get(id);
    if(b) open.add(b);
    sel=id; syncTree(); render(); showNode(id);
  }));
  const back=drawer.querySelector("[data-back]");
  if(back) back.addEventListener("click",()=>{ sel=null; render(); showView(); });
}
const rowFor=(n,extra)=>`<div class="kv link" data-goto="${esc(n.id)}"><span class="k">${esc(n.label)}</span><span class="v">${esc(extra||"")}</span></div>`;

function showOverview(){
  const rows=BRANCHES.map(b=>`<div class="kv link" data-open="${esc(b.id)}">
      <span class="k"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colorOf(b.group)};margin-right:7px"></span>${esc(b.label)}</span>
      <span class="v">${b.count}</span></div>`).join("");
  const sig=(D.signals||[]).slice(0,3).map(cardFor).join("");
  panel("#141924", esc(D.webapp||D.host), esc(D.host)+" · "+esc(D.ingest),
    `<div class="empty">A graph of one web application, built from captured traffic. The root is the app; each branch is one kind of thing it is made of. Open a branch to see its nodes, click a node for its evidence.</div>
     <div class="subh">What is in this model</div>${rows}
     ${sig?`<div class="subh hot">Worth reading first</div>${sig}`:""}
     <div class="subh">Honesty</div>
     <div class="empty">${esc(D.note||"")}</div>`);
  drawer.querySelectorAll("[data-open]").forEach(el=>el.addEventListener("click",()=>{
    open.add(el.dataset.open); syncTree(); render();
    showBranch(BRANCHES.find(b=>b.id===el.dataset.open));
  }));
}

function showBranch(b){
  if(!b) return showOverview();
  const rows=b.children.slice(0,120).map(c=>rowFor(c, (c.attrs&&(c.attrs.provider||c.attrs.method||c.attrs.category))||"")).join("");
  const more=b.children.length>120?`<div class="empty">…and ${b.children.length-120} more.</div>`:"";
  panel(colorOf(b.group), esc(b.label), b.count+" node"+(b.count===1?"":"s"),
    `<button class="back" data-back>← overview</button>${rows}${more}`);
}

function cardFor(s){
  return `<div class="card">
    <div class="ti">${esc(s.title)}</div>
    <div class="meta"><span class="att">${"●".repeat(Math.max(1,Math.min(5,s.attention)))}</span>
      ${esc(s.kind)} · ${esc(s.confidence)} confidence</div>
    ${s.summary?`<div class="bd">${esc(s.summary)}</div>`:""}
    ${s.why?`<div class="bd" style="margin-top:5px"><b>Why:</b> ${esc(s.why)}</div>`:""}
    ${s.suggested?`<div class="bd" style="margin-top:5px"><b>Next:</b> ${esc(s.suggested)}</div>`:""}
  </div>`;
}

function showFindings(){
  const secrets=D.nodes.filter(n=>n.type==="secret_candidate");
  const ai=D.nodes.filter(n=>n.type==="ai_service");
  const sig=(D.signals||[]).map(cardFor).join("");
  let html=`<button class="back" data-back>← overview</button>`;
  if(SURFACE.size){
    html+=`<div class="subh hot">Crossed role boundary (${SURFACE.size})</div>`;
    [...SURFACE].forEach(id=>{ const n=N.get(id); if(n) html+=rowFor(n,(n.attrs&&n.attrs.response_status)||""); });
    html+=`<div class="empty" style="margin-top:6px">Reached by <b>${esc(LOW)}</b>, offered only to <b>${esc(HIGH)}</b>. A hypothesis, not a finding.</div>`;
  }
  if(secrets.length){
    html+=`<div class="subh hot">Credential candidates (${secrets.length})</div>`;
    secrets.forEach(n=>html+=rowFor(n,(n.attrs&&n.attrs.candidate_type)||""));
    html+=`<div class="empty" style="margin-top:6px">Never validated against any service. The value is not stored — only a hash of it.</div>`;
  }
  if(ai.length){
    html+=`<div class="subh hot">Model APIs (${ai.length})</div>`;
    ai.forEach(n=>html+=rowFor(n,(n.attrs&&n.attrs.provider)||""));
  }
  html += sig ? `<div class="subh">What deserves attention (${(D.signals||[]).length})</div>${sig}`
              : `<div class="empty">Nothing flagged. That is a statement about this capture, not about the application.</div>`;
  panel("var(--signal)","Findings","what the model flagged",html);
}

function showCrossRole(){
  if(!SURFACE.size){
    panel("var(--signal)","Cross-role surface", LOW&&HIGH ? esc(LOW)+" vs "+esc(HIGH) : "not available",
      `<button class="back" data-back>← overview</button>
       <div class="empty">${esc((D.cross_role&&D.cross_role.unavailable) || "Nothing crossed.")}
       <br><br>A cross-role diff needs two captured identities. Export a second session from Burp and ingest it with <code>--role</code>.</div>`);
    return;
  }
  let rows="";
  SURFACE.forEach(id=>{ const n=N.get(id); if(n) rows+=rowFor(n,(n.attrs&&n.attrs.response_status)||""); });
  panel("var(--signal)","Cross-role surface", esc(LOW)+" (low) vs "+esc(HIGH)+" (high)",
    `<button class="back" data-back>← overview</button>
     <div class="empty">Endpoints <b>${esc(LOW)}</b> reached that only <b>${esc(HIGH)}</b> is offered:</div>${rows}
     <div class="subh hot">What this proves — and does not</div>
     <div class="empty">Each is a broken-access-control <b>hypothesis</b> with the exact low-role request as evidence. It does <b>not</b> prove the response was authorised rather than an unhandled leak. Replay each as ${esc(LOW)} and compare with ${esc(HIGH)}.</div>`);
}

function evBlock(id){
  const e=(D.evidence||{})[id];
  if(!e) return `<div class="kv"><span class="k">evidence</span><span class="v ev">${esc(id)}</span></div>`;
  const red=s=>esc(s).replace(/\[REDACTED\]/g,'<span class="red">[REDACTED]</span>');
  return `<div class="subh">Evidence · ${esc(id)} <span class="ev">${esc(e.role||"")}</span></div>
    <div class="kv"><span class="k">${esc(e.method)} ${esc(e.status)}</span><span class="v">${esc(e.url)}</span></div>
    <div class="subh">Request</div><pre>${red(e.request)}</pre>
    <div class="subh">Response</div><pre>${red(e.response)}</pre>`;
}

function showNode(id){
  const n=N.get(id); if(!n) return showView();
  const conn=D.edges.filter(e=>e.from===id||e.to===id);
  let tags="";
  if(n.state) tags+=`<span class="tag ${n.state==='REACHED_BY_LOWER_ROLE'?'hot':(n.state==='STATIC_ONLY'?'warn':'obs')}">${esc(n.state)}</span>`;
  (n.roles||[]).forEach(r=>tags+=`<span class="tag">reached by ${esc(r)}</span>`);
  (n.unknowns||[]).forEach(u=>tags+=`<span class="tag ${u==='ROLE_BOUNDARY_UNKNOWN'?'hot':'warn'}">${esc(u)}</span>`);
  let attrs=""; for(const k in (n.attrs||{})) attrs+=`<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(n.attrs[k])}</span></div>`;
  const links=conn.slice(0,14).map(e=>{
    const other=e.from===id?e.to:e.from, dir=e.from===id?"→":"←";
    return `<div class="kv link" data-goto="${esc(other)}"><span class="k">${dir} ${esc(e.type)}${e.state==='INFERRED'?' <span class="ev" style="color:var(--inferred)">inferred</span>':''}</span><span class="v">${esc((N.get(other)||{}).label||other)}</span></div>`;
  }).join("");
  const why = SURFACE.has(id) ? `<div class="subh hot">Why this is flagged</div>
      <div class="empty">Reached by <b>${esc(LOW)}</b>, but the application offers it only to <b>${esc(HIGH)}</b>. A broken-access-control <b>hypothesis</b>, not a finding. Replay as ${esc(LOW)} and compare with ${esc(HIGH)}.</div>` : "";
  panel(colorOf(n.group), esc(n.label), esc((D.groups.find(g=>g.id===n.group)||{}).label||n.group)+" · "+esc(n.type),
    `<button class="back" data-back>← back</button>
     ${n.full&&n.full!==n.label?`<div class="kv"><span class="k">subject</span><span class="v">${esc(n.full)}</span></div>`:""}
     ${tags?`<div style="margin:6px 0">${tags}</div>`:""}
     ${attrs?`<div class="subh">Attributes</div>${attrs}`:""}
     <div class="subh">Connections (${conn.length})</div>${links||'<div class="empty">None in this model.</div>'}
     ${why}
     ${(n.evidence||[]).map(evBlock).join("")}`);
}

/* ------------------------------------------------------------- the panels */
function syncViews(){
  document.getElementById("views").innerHTML = VIEWS
    .filter(v=>v.needs!=="surface"||SURFACE.size)
    .map(v=>`<button class="view${v.id===view?" active":""}${v.hot?" hot":""}" data-view="${v.id}">`
      + `${v.name}<span class="d">${v.d}</span></button>`).join("");
  document.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>applyView(b.dataset.view)));
}
function syncTree(){
  document.getElementById("tree").innerHTML = BRANCHES.map(b=>`
    <button class="row${open.has(b.id)?" on":""}" data-branch="${b.id}">
      <span class="chev">▶</span>
      <span class="dot" style="background:${colorOf(b.group)}"></span>
      <span class="nm">${esc(b.label)}</span><span class="ct">${b.count}</span>
    </button>`).join("");
  document.querySelectorAll("[data-branch]").forEach(el=>el.addEventListener("click",()=>toggle(el.dataset.branch)));
}

function fillHeader(){
  document.getElementById("ttl").textContent="SignalMap · "+(D.webapp||D.host);
  document.getElementById("sub").innerHTML=`${esc(D.host)} · <b>${esc(D.ingest)}</b> · from Burp · ${esc((D.generated_at||"").replace("T"," ").replace("+00:00","Z"))}`;
  const g=id=>(D.groups.find(x=>x.id===id)||{}).count||0;
  const cells=[
    [g("route"),"routes"], [g("api"),"APIs"], [g("script"),"JS"],
    [g("thirdparty"),"third parties"], [g("vendor"),"tech"],
    [g("finding"),"findings",true], [SURFACE.size,"cross-role",true]
  ].filter(c=>c[0]||!c[2]);
  document.getElementById("stats").innerHTML=cells
    .map(c=>`<div class="stat${c[2]?" hot":""}"><b>${c[0]}</b><span>${c[1]}</span></div>`).join("");

  document.getElementById("edgekey").innerHTML=
    `<div class="key"><svg viewBox="0 0 28 8"><path d="M1 4 Q14 4 27 4" stroke="var(--line2)" stroke-width="1.6" fill="none"/></svg> branch — part of the app</div>
     <div class="key"><svg viewBox="0 0 28 8"><line x1="1" y1="4" x2="27" y2="4" stroke="#C8D0D9" stroke-width="1.4"/></svg> OBSERVED — seen in this capture</div>
     <div class="key"><svg viewBox="0 0 28 8"><line x1="1" y1="4" x2="27" y2="4" stroke="#C3B8F0" stroke-width="1.4" stroke-dasharray="4 4"/></svg> INFERRED — worked out, not seen</div>
     ${SURFACE.size?`<div class="key"><svg viewBox="0 0 28 8"><line x1="1" y1="4" x2="27" y2="4" stroke="var(--signal)" stroke-width="2.4"/></svg> crossed role boundary</div>`:""}
     <div class="note" style="margin-top:8px">Scroll to zoom, drag the background to pan, drag a node to move it.</div>`;

  const tr=D.trimmed||{}, parts=[];
  if(tr.folded_security_controls) parts.push(tr.folded_security_controls+" security-header node(s) folded onto their page");
  if(tr.merged_pages) parts.push(tr.merged_pages+" page(s) merged into their route");
  if(tr.dropped_for_size) parts.push(tr.dropped_for_size+" node(s) left off");
  if(parts.length) document.getElementById("trimnote").innerHTML=
    `<h2>Simplified for reading</h2><div class="note">${parts.join("; ")}. The full model is in <code>model/graph.json</code>.</div>`;

  document.getElementById("foot").textContent =
    "Observed in this capture — never 'reachable in general'. Values were redacted before anything was written.";
}

/* -------------------------------------------------------------- controls */
document.getElementById("search").addEventListener("input",e=>{
  search=e.target.value;
  /* A search opens every branch that contains a match, so a hit is never
     hidden behind a branch the reader has not thought to open. */
  if(search.trim()){
    const q=search.trim().toLowerCase();
    BRANCHES.forEach(b=>{ if(b.children.some(c=>((c.full||"")+" "+c.label).toLowerCase().includes(q))) open.add(b.id); });
    syncTree();
  }
  render();
});
document.getElementById("expandall").addEventListener("click",()=>{ BRANCHES.forEach(b=>open.add(b.id)); syncTree(); render(); });
document.getElementById("collapseall").addEventListener("click",()=>{ open.clear(); syncTree(); render(); showOverview(); });
document.getElementById("reset").addEventListener("click",()=>{
  P.forEach((p,k)=>P.set(k,{x:p.x,y:p.y,pin:false}));
  zoom=1; panX=0; panY=0; search=""; document.getElementById("search").value="";
  applyView("overview");
});
document.getElementById("export").addEventListener("click",()=>{
  size();
  const clone=svg.cloneNode(true);
  clone.setAttribute("xmlns",SVGNS); clone.setAttribute("width",W); clone.setAttribute("height",H);
  const bg=document.createElementNS(SVGNS,"rect");
  bg.setAttribute("width",W); bg.setAttribute("height",H); bg.setAttribute("fill","#FAFBFC");
  clone.insertBefore(bg,clone.firstChild);
  const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],{type:"image/svg+xml"}));
  const img=new Image();
  const save=(href,ext)=>{ const a=document.createElement("a"); a.href=href; a.download=`signalmap-${D.webapp}-graph.${ext}`; a.click(); };
  img.onload=()=>{
    try{
      const cv=document.createElement("canvas"); cv.width=W*2; cv.height=H*2;
      const ctx=cv.getContext("2d"); ctx.scale(2,2); ctx.drawImage(img,0,0);
      cv.toBlob(b=>{ save(URL.createObjectURL(b),"png"); URL.revokeObjectURL(url); });
    }catch(_){ save(url,"svg"); }
  };
  img.onerror=()=>save(url,"svg");
  img.src=url;
});
addEventListener("resize",()=>render());

/* ----------------------------------------------------------------- start */
fillHeader();
applyView(SURFACE.size ? "crossrole" : ((D.signals||[]).length ? "findings" : "overview"));
</script>
</body>
</html>
